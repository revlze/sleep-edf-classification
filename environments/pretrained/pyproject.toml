[project]
name = "sleep-edf-pretrained"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "braindecode[hub] @ git+https://github.com/braindecode/braindecode.git@2482cb5a9511bf5d2f34fbcaefd6338a472aaedd",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "polars==1.32.3",
    "omegaconf==2.3.0",
    "tqdm==4.67.1",
    "safetensors==0.6.2",
    "portalocker==3.2.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
