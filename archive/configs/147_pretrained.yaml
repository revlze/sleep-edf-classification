# Check temporal extent in AnySleep global channel attention; no training or other changes.
seed: 42
data:
  version: full_psg_v1
  root: data/raw
  units: microvolts
  sampling_rate: 100
  epoch_seconds: 30
  channel_order:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
training:
  enabled: false
evaluation:
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  protocol: frozen provided validation -> selection on validation B macro-F1 -> all
    successful unlabelled test variants
  limitation: reused validation; AnySleep author pretraining overlap; no independent
    final estimate
  baseline_id: 19
experiment_id: 147_pretrained
paths:
  artefacts: artefacts/147_pretrained
  submission: submissions/147_pretrained.csv
summary: 'Frozen AnySleep run1/2/3: core256/halo128'
model:
  kind: anysleep_context
  family: anysleep
  checkpoints:
  - anysleep-run1.pth
  - anysleep-run2.pth
  - anysleep-run3.pth
  source_revision: 899bfff284f3eb3e7448bc90990f2230757470a2
  aggregation: equal mean of three softmax probabilities
preprocessing:
  recipe: 'unchanged019: per-contiguous-segment microvolts -> volts -> resample_poly128/100
    -> clip +/-20IQR -> RobustScaler'
  fit_scope: each continuous segment independently; reused across context variants
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
inference:
  mode: blocks
  core_epochs: 256
  halo_epochs: 128
  encoder_grid_epochs: 16
  precision: float32; autocast disabled as original019
  batching: equal input lengths, initial maximum4; on GPU OOM reduce only batch dimension
    to1
  oom_policy: explicit skipped_oom at batch1; no temporal cropping, block substitution
    or precision fallback
  segment_boundaries: record changes and missing epoch_index; every epoch output exactly
    once
