# Refit only Gate4/TCN4; pretrained experts and old embeddings stay frozen.
seed: 42
data:
  version: full_psg_v1
  root: data/raw
evaluation:
  protocol: provided validation only for comparisons; unlabelled test for fixed submissions
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  controls:
  - 113_pretrained
  - 156_pretrained
  - 157_pretrained
  limitation: reused validation and possible author-pretraining overlap; not an independent
    estimate
experiment_id: 165_pretrained
summary: E Base4 + retrained Gate4 and TCN4 using frozen U-Sleep156
training:
  enabled: true
  backbones_frozen: true
  hyperparameter_search: false
  source_cross_fitting: Reuse original inner2 nested082/085 and grouped3 outer folds;
    no expert training
  usleep_train: one cached frozen inference, exact own156 core128/halo64 pipeline
  normalization: fit only outer-train rows; final refit on train only
model:
  kind: four_expert_gate_tcn
  experts:
  - '156'
  - 019
  - 082
  - 085
  prior_weights:
  - 0.3333333333333333
  - 0.3333333333333333
  - 0.16666666666666666
  - 0.16666666666666666
  final_weights:
    base4: 0.5
    gate4: 0.25
    tcn4: 0.25
components:
  gate:
    training:
      enabled: true
      optimizer: AdamW
      lr: 0.0003
      weight_decay: 0.001
      epochs: 16
      patience: 3
      batch_size: 4096
      regularization: 0.01
      center_stride: 1
      grad_clip: 1.0
      selection: train-only subject GroupKFold3; median best epoch refit
      expert_cross_fitting: verified cached inner2 source predictions; no source expert
        fits
    model:
      kind: gate
      architecture: mlp
      hidden: 64
      features: physio
      context: 1
      prior_weights:
      - 0.3333333333333333
      - 0.3333333333333333
      - 0.16666666666666666
      - 0.16666666666666666
      zero_initialized_head: true
      regularization: KL(gate || prior)
      experts:
      - '156'
      - 019
      - 082
      - 085
  tcn:
    training:
      enabled: true
      optimizer: AdamW
      lr: 0.0003
      weight_decay: 0.001
      epochs: 12
      patience: 3
      batch_size: 512
      regularization: 0.001
      center_stride: 4
      grad_clip: 1.0
      selection: train-only subject GroupKFold3; median best epoch refit
      expert_cross_fitting: verified cached inner2 source predictions; no source expert
        fits
    model:
      kind: temporal_residual
      architecture: tcn
      context: 20
      hidden: 64
      features: embeddings
      zero_initialized_head: true
      center_supervision: false
      center_loss_weight: 1.0
      neighbor_loss_weight: 0.0
      implementation: small downstream residual model inspired by long-context/center
        supervision; no claim of reproducing those papers
      prior_weights:
      - 0.3333333333333333
      - 0.3333333333333333
      - 0.16666666666666666
      - 0.16666666666666666
      experts:
      - '156'
      - 019
      - 082
      - 085
paths:
  artefacts: artefacts/165_pretrained
  submission: submissions/165_pretrained.csv
