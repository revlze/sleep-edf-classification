# Hypothesis: Frozen original seqsleepnet: independent representation source and diversity vs 053
experiment_id: 060_pretrained
seed: 42
summary: 'Frozen original seqsleepnet: independent representation source and diversity
  vs 053'
group: frozen
data:
  version: full_psg_v1
  root: data/raw
  units: microvolts
  epoch_seconds: 30
  sampling_rate: 100
  channel_order:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
paths:
  artefacts: artefacts/060_pretrained
  submission: submissions/060_pretrained.csv
model:
  kind: official
  recipe:
    name: seqsleepnet
preprocessing:
  recipe: MASS checkpoint despite initial Sleep-EDF assumption; Fpz BP.3-40, power-dB
    Hamming200/100 STFT256, context20
  learned_statistics: training fold only; fixed author record preprocessing allowed
training:
  enabled: false
evaluation:
  protocol: provided val -> unlabelled test
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  baseline: 053_pretrained
