# Choose the 534-feature OOF winner; test multi-resolution with its shortlisted settings.

retired: true
retirement_reason: Automatic winner/search plan cancelled; use fixed 015_tree.
experiment_id: 014_tree
seed: 42
data_revision: full_psg_v1
paths:
  data_root: data/raw
  output_root: artefacts
  cache_root: artefacts/cache/features
  fold_root: artefacts/splits
features:
  context: multires
  extractor:
    epsilon: 1.0e-12
    welch_nperseg: 500
    welch_noverlap: 250
    welch_window: hamming
    welch_average: median
    higuchi_kmax: 10
    permutation_order: 3
    batch_size: 32
preprocessing:
  transform: native_nan
model:
  type: auto
  class_weight: auto
  params: {}
cv:
  strategy: StratifiedGroupKFold
  n_splits: 3
training:
  threads: auto
  max_iterations: 2000
  patience: 100
search:
  screen_fold: 0
  top_k: 2
  candidates: []
benchmark:
  iterations: 100
  max_seconds: 60
  train_epochs: 50000
  val_epochs: 20000
parent_candidates:
- 010_tree
- 011_tree
- 012_tree
- 013_tree
