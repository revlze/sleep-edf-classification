# Hypothesis: Frozen contextual embeddings ['tiny', 'physio'] -> lr
experiment_id: 089_pretrained
seed: 42
summary: Frozen contextual embeddings ['tiny', 'physio'] -> lr
group: embeddings
data:
  version: full_psg_v1
  root: data/raw
  units: microvolts
  epoch_seconds: 30
  sampling_rate: 100
  channel_order:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
paths:
  artefacts: artefacts/089_pretrained
  submission: submissions/089_pretrained.csv
model:
  kind: embedding_classifier
  classifier: lr
  features:
  - tiny
  - physio
preprocessing:
  recipe: pinned official adapter; contiguous segments only
  learned_statistics: training fold only; fixed author record preprocessing allowed
training:
  enabled: true
evaluation:
  protocol: train GroupKFold3 -> full-train refit -> provided val -> unlabelled test
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  baseline: 053_pretrained
search:
  trials:
  - C: 0.1
  - C: 1.0
  - C: 10.0
  selection: pooled train grouped OOF macro-F1; report fold stability and log loss
