# Hypothesis: Frozen embeddings CE + bounded hard-negative SupCon
seed: 42
data:
  version: full_psg_v1
  root: data/raw
  sampling_rate: 100
  epoch_seconds: 30
  units: microvolts
  channels:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
preprocessing:
  recipe: saved immutable inputs; segment resets at record/epoch gaps; train-fold-only
    learned scaling
evaluation:
  protocol: subject GroupKFold3 -> median-epoch full-train refit -> provided val ->
    unlabelled test
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  baseline: 113_pretrained
  limitation: provided val reused; original author pretraining overlap remains separate
    from downstream CV
experiment_id: 128_pretrained
summary: Frozen embeddings CE + bounded hard-negative SupCon
group: contrastive
model:
  kind: contrastive
  contrastive_weight: 0.1
  hard_negatives: true
  temperature: 0.1
  embedding_layers:
  - Tiny original contextual rolling128
  - AnySleep run1 AvgPool pre-classifier6
  architecture: 134 -> 128 LayerNorm GELU dropout.15 -> 64 -> classifier5; projection64
    -> 64 -> 32
  balanced_sampler: same distinct class-balanced batches for CE/SupCon; prior-corrected
    CE; no SMOTE
  references:
  - https://www.sciencedirect.com/science/article/pii/S0010482523009666
  - https://www.sciencedirect.com/science/article/pii/S0925231225030711
  implementation: frozen-embedding adaptation, not reproduction of BST-SCCL or MFCR-SleepNet
paths:
  artefacts: artefacts/128_pretrained
  submission: submissions/128_pretrained.csv
training:
  enabled: true
  epochs: 12
  patience: 3
  batch_size: 640
  lr: 0.0003
  weight_decay: 0.001
  optimizer: AdamW
  allow_training_required: true
  selection: same3 subject folds; fold-only early stopping; median best epoch refit
