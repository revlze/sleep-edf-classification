# Hypothesis: Tiny041 full: lr=3e-06, class_weight=none, focal_gamma=0
experiment_id: 084_pretrained
seed: 42
summary: 'Tiny041 full: lr=3e-06, class_weight=none, focal_gamma=0'
group: tiny_finetune
data:
  version: full_psg_v1
  root: data/raw
  units: microvolts
  epoch_seconds: 30
  sampling_rate: 100
  channel_order:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
paths:
  artefacts: artefacts/084_pretrained
  submission: submissions/084_pretrained.csv
model:
  kind: tiny_finetune
  strategy: full
  checkpoint: tinysleepnet.pt
  channel: 0
  batch_norm: published running statistics frozen; affine trainable in full FT
preprocessing:
  recipe: pinned official adapter; contiguous segments only
  learned_statistics: training fold only; fixed author record preprocessing allowed
training:
  enabled: true
  lr: 3.0e-06
