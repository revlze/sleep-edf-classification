  class_weight: none
  focal_gamma: 0
  epochs: 5
  steps_per_epoch: 96
  batch_size: 4
  accumulation: 2
  grad_clip: 1.0
  patience: 2
  min_delta: 0.0001
  early_stop_epochs_per_record: 256
  refit: median fold best epoch
evaluation:
  protocol: train GroupKFold3 -> full-train refit -> provided val -> unlabelled test
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  baseline: 053_pretrained
