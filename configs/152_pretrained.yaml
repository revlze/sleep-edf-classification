# Replace only AnySleep in the fixed B mixture, keeping082/085 probabilities.
seed: 42
data:
  version: full_psg_v1
  root: data/raw
  units: microvolts
  sampling_rate: 100
  epoch_seconds: 30
  channel_order:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
training:
  enabled: false
evaluation:
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  protocol: frozen provided validation -> selection on validation B macro-F1 -> all
    successful unlabelled test variants
  limitation: reused validation; AnySleep author pretraining overlap; no independent
    final estimate
  baseline_id: 99
experiment_id: 152_pretrained
paths:
  artefacts: artefacts/152_pretrained
  submission: submissions/152_pretrained.csv
summary: Simple B with 149_pretrained AnySleep context
model:
  kind: saved_context_ensemble
  members:
  - 149_pretrained
  - 082_pretrained
  - 085_pretrained
  weights:
  - 0.5
  - 0.25
  - 0.25
  source_context: 149_pretrained
preprocessing:
  recipe: align saved probabilities by epoch ID; float64 weighted mean, row normalize,
    float32 output; no new inference
