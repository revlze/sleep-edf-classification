# Hypothesis: Residual TCN context100 on frozen embeddings
seed: 42
data:
  version: full_psg_v1
  root: data/raw
  units: microvolts
  sampling_rate: 100
  epoch_seconds: 30
  channel_order:
  - EEG Fpz-Cz
  - EEG Pz-Oz
  - EOG horizontal
preprocessing:
  recipe: verified saved expert probabilities; train-fold imputation and standardization
  context: real epochs within record_id and consecutive epoch_index; masked right
    padding
training:
  enabled: true
  optimizer: AdamW
  lr: 0.0003
  weight_decay: 0.001
  epochs: 12
  patience: 3
  batch_size: 512
  regularization: 0.001
  center_stride: 4
  grad_clip: 1.0
  selection: train-only subject GroupKFold3; median best epoch refit
  expert_cross_fitting: outer held original082/085 OOF; outer train nestedGroupKFold2
    fixed5epoch experts, cached once
evaluation:
  protocol: train subject GroupKFold3 -> full-train refit -> provided val -> unlabelled
    test
  class_order:
  - W
  - N1
  - N2
  - N3
  - REM
  baseline: 099_pretrained
  limitation: official validation reused; author pretraining overlap is separate from
    downstream subject CV
experiment_id: 107_pretrained
summary: Residual TCN context100 on frozen embeddings
group: temporal
model:
  kind: temporal_residual
  architecture: tcn
  context: 100
  hidden: 64
  features: embeddings
  zero_initialized_head: true
  center_supervision: false
  center_loss_weight: 1.0
  neighbor_loss_weight: 0.0
  references:
  - https://www.mdpi.com/2076-3417/16/9/4092
  - https://www.mdpi.com/2076-3425/16/10/1108
  implementation: small downstream residual model inspired by long-context/center
    supervision; no claim of reproducing those papers
paths:
  artefacts: artefacts/107_pretrained
  submission: submissions/107_pretrained.csv
