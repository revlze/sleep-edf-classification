# Final refit of frozen 007 tuned parameters on train+val; no independent val score.

experiment_id: 008_linear
seed: 42
data_revision: full_psg_v1
features:
  context: multires
  extractor:
    epsilon: 1.0e-12
    welch_nperseg: 500
    welch_noverlap: 250
    welch_window: hamming
    welch_average: median
    higuchi_kmax: 10
    permutation_order: 3
    batch_size: 32
preprocessing:
  transform: quantile
  epsilon: 1.0e-12
  n_quantiles: 100
  quantile_subsample: 100000
  robust_quantiles:
  - 25
  - 75
model:
  type: logistic_regression
  solver: lbfgs
  l1_ratio: 0.0
  C: 0.01
  class_weight: sqrt
  max_iter: 5000
  tol: 0.0001
paths:
  data_root: data/raw
  output_root: artefacts
training:
  scope: train_val
  threads: 10
source_checkpoint: artefacts/007_linear/tuned.joblib
