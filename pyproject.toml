[project]
name = "sleep-edf-neuroscience"
version = "0.1.0"
description = "Reproducible experiments for Sleep-EDF sleep stage classification"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["data", "artefacts", "submissions", "docs", "desc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
