[project]
name = "sleep-edf-final"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0", "numpy==2.2.6", "scipy==1.15.3",
  "scikit-learn==1.6.1", "omegaconf==2.3.0", "tqdm==4.67.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff>=0.14,<0.15"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
extend-exclude = ["src/sleep_edf_final/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
# Preserve code cells exactly as downloaded from the executed Kaggle version.
exclude = ["notebooks/06_final.ipynb"]
